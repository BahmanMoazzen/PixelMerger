<svg xmlns="http://www.w3.org/2000/svg" width="480" height="960" viewBox="0 0 480 960">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="960" fill="url(#bg1)"/>

  <!-- Chalkboard texture lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="320" x2="480" y2="320"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="0" y1="480" x2="480" y2="480"/>
    <line x1="0" y1="560" x2="480" y2="560"/>
    <line x1="0" y1="640" x2="480" y2="640"/>
    <line x1="0" y1="720" x2="480" y2="720"/>
    <line x1="0" y1="800" x2="480" y2="800"/>
    <line x1="0" y1="880" x2="480" y2="880"/>
  </g>

  <!-- Scattered dim background numbers -->
  <g font-family="Georgia, serif" text-anchor="middle" fill="#1e3a6e" font-weight="bold">
