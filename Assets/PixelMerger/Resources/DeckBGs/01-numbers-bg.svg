    <text x="130" y="55" font-size="45" opacity="0.4">3</text>
    <text x="230" y="90" font-size="70" opacity="0.3">9</text>
    <text x="340" y="70" font-size="50" opacity="0.4">1</text>
    <text x="440" y="110" font-size="55" opacity="0.35">5</text>
    <text x="70" y="200" font-size="40" opacity="0.3">2</text>
    <text x="190" y="180" font-size="65" opacity="0.25">8</text>
    <text x="380" y="195" font-size="48" opacity="0.35">4</text>
    <text x="460" y="250" font-size="42" opacity="0.3">6</text>
    <text x="20" y="330" font-size="55" opacity="0.3">0</text>
    <text x="155" y="290" font-size="48" opacity="0.25">11</text>
    <text x="310" y="310" font-size="60" opacity="0.3">7</text>
    <text x="450" y="370" font-size="44" opacity="0.35">3</text>
    <text x="80" y="430" font-size="70" opacity="0.2">5</text>
    <text x="240" y="410" font-size="50" opacity="0.25">2</text>
    <text x="390" y="445" font-size="55" opacity="0.3">9</text>
    <text x="30" y="540" font-size="48" opacity="0.3">4</text>
    <text x="170" y="520" font-size="65" opacity="0.2">6</text>
    <text x="340" y="555" font-size="42" opacity="0.28">1</text>
    <text x="460" y="510" font-size="58" opacity="0.25">8</text>
    <text x="100" y="640" font-size="50" opacity="0.3">3</text>
    <text x="260" y="620" font-size="72" opacity="0.2">0</text>
    <text x="415" y="655" font-size="46" opacity="0.3">7</text>
    <text x="40" y="740" font-size="44" opacity="0.25">9</text>
    <text x="185" y="720" font-size="60" opacity="0.2">2</text>
    <text x="335" y="745" font-size="55" opacity="0.28">5</text>
    <text x="455" y="730" font-size="40" opacity="0.3">4</text>
    <text x="90" y="840" font-size="68" opacity="0.2">6</text>
    <text x="240" y="820" font-size="50" opacity="0.25">1</text>
    <text x="380" y="850" font-size="48" opacity="0.3">8</text>
    <text x="460" y="900" font-size="55" opacity="0.2">3</text>
    <text x="60" y="930" font-size="44" opacity="0.25">7</text>
    <text x="215" y="950" font-size="60" opacity="0.2">0</text>
  </g>

  <!-- Glowing mid-layer numbers -->
  <g font-family="Georgia, serif" text-anchor="middle" font-weight="bold" filter="url(#glow1)">
    <text x="80" y="155" font-size="52" fill="#4a9eff" opacity="0.55">4</text>
    <text x="310" y="135" font-size="58" fill="#ff9f40" opacity="0.5">7</text>
    <text x="200" y="270" font-size="62" fill="#50e3c2" opacity="0.45">2</text>
    <text x="420" y="290" font-size="48" fill="#ff6b6b" opacity="0.5">9</text>
    <text x="55" y="390" font-size="56" fill="#ffd700" opacity="0.45">5</text>
    <text x="280" y="380" font-size="50" fill="#a78bfa" opacity="0.5">8</text>
    <text x="160" y="480" font-size="64" fill="#4a9eff" opacity="0.4">3</text>
    <text x="390" y="490" font-size="54" fill="#ff9f40" opacity="0.45">6</text>
    <text x="75" y="600" font-size="58" fill="#50e3c2" opacity="0.4">1</text>
    <text x="320" y="585" font-size="60" fill="#ff6b6b" opacity="0.45">0</text>
    <text x="210" y="690" font-size="52" fill="#ffd700" opacity="0.4">7</text>
    <text x="440" y="680" font-size="48" fill="#a78bfa" opacity="0.45">4</text>
    <text x="120" y="790" font-size="62" fill="#4a9eff" opacity="0.38">9</text>
    <text x="355" y="770" font-size="56" fill="#50e3c2" opacity="0.42">2</text>
    <text x="240" y="880" font-size="58" fill="#ff9f40" opacity="0.4">6</text>
  </g>

  <!-- Bright hero numbers in center strip -->
  <g font-family="Georgia, serif" text-anchor="middle" font-weight="bold" filter="url(#softglow)">
    <text x="130" y="350" font-size="88" fill="#ffffff" opacity="0.18">8</text>
    <text x="350" y="420" font-size="96" fill="#ffffff" opacity="0.15">3</text>
    <text x="240" y="560" font-size="100" fill="#4a9eff" opacity="0.2">5</text>
    <text x="120" y="700" font-size="84" fill="#ffffff" opacity="0.15">1</text>
    <text x="370" y="760" font-size="92" fill="#ffffff" opacity="0.13">7</text>
