  <rect width="480" height="960" fill="url(#vignette1)" opacity="0.6"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="480" height="3" fill="#4a9eff" opacity="0.6"/>
  <rect x="0" y="957" width="480" height="3" fill="#4a9eff" opacity="0.6"/>
</svg>
