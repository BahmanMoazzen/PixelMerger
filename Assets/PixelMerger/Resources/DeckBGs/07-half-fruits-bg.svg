      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="60%" stop-color="#fff3cd"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </radialGradient>
    <radialGradient id="vig7" cx="50%" cy="50%" r="80%">
