    <path d="M80,410 C80,403 88,398 95,403 C102,398 110,403 110,410 C110,420 95,430 95,430 C95,430 80,420 80,410Z"/>
    <path d="M370,360 C370,354 377,350 383,354 C389,350 396,354 396,360 C396,369 383,378 383,378 C383,378 370,369 370,360Z"/>
    <path d="M200,500 C200,495 206,491 211,495 C216,491 222,495 222,500 C222,507 211,515 211,515 C211,515 200,507 200,500Z"/>
