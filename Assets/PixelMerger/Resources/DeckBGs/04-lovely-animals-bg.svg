  <g fill="#fff3e0" opacity="0.7">
    <ellipse cx="100" cy="300" rx="70" ry="30"/>
    <ellipse cx="145" cy="286" rx="50" ry="27"/>
    <ellipse cx="65" cy="292" rx="42" ry="25"/>
    <ellipse cx="380" cy="350" rx="65" ry="28"/>
    <ellipse cx="422" cy="337" rx="48" ry="24"/>
    <ellipse cx="345" cy="342" rx="40" ry="22"/>
    <ellipse cx="60" cy="450" rx="55" ry="24"/>
    <ellipse cx="98" cy="438" rx="42" ry="22"/>
    <ellipse cx="30" cy="443" rx="35" ry="20"/>
    <ellipse cx="380" cy="480" rx="58" ry="25"/>
    <ellipse cx="420" cy="467" rx="44" ry="22"/>
