    <line x1="48" y1="800" x2="48" y2="755"/>
    <line x1="56" y1="800" x2="61" y2="762"/>
    <ellipse cx="40" cy="757" rx="6" ry="10" fill="#f9a825" stroke="none"/>
    <ellipse cx="48" cy="752" rx="6" ry="10" fill="#f9a825" stroke="none"/>
    <ellipse cx="61" cy="759" rx="6" ry="10" fill="#f9a825" stroke="none"/>
  </g>
  <g stroke="#f9a825" stroke-width="2.5" fill="none" opacity="0.8">
    <line x1="400" y1="800" x2="395" y2="760"/>
    <line x1="408" y1="800" x2="408" y2="755"/>
    <line x1="416" y1="800" x2="421" y2="762"/>
