  <circle cx="240" cy="160" r="55" fill="#fff9c4" opacity="0.95"/>
  <circle cx="240" cy="160" r="42" fill="#ffee58"/>

  <!-- Sun rays -->
  <g stroke="#ffe082" stroke-width="2.5" opacity="0.55">
    <line x1="240" y1="90" x2="240" y2="55"/>
    <line x1="240" y1="230" x2="240" y2="265"/>
    <line x1="170" y1="160" x2="135" y2="160"/>
    <line x1="310" y1="160" x2="345" y2="160"/>
    <line x1="190" y1="110" x2="165" y2="85"/>
    <line x1="290" y1="210" x2="315" y2="235"/>
    <line x1="290" y1="110" x2="315" y2="85"/>
    <line x1="190" y1="210" x2="165" y2="235"/>
    <line x1="175" y1="130" x2="148" y2="108"/>
    <line x1="305" y1="190" x2="332" y2="212"/>
    <line x1="175" y1="190" x2="148" y2="212"/>
    <line x1="305" y1="130" x2="332" y2="108"/>
