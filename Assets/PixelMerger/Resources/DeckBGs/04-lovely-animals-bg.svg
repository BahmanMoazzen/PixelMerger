  <rect width="480" height="960" fill="url(#vig4)"/>

  <!-- Soft golden border -->
  <rect x="0" y="0" width="480" height="4" fill="#ffe082" opacity="0.7"/>
  <rect x="0" y="956" width="480" height="4" fill="#ff8a65" opacity="0.7"/>
  <rect x="0" y="0" width="4" height="960" fill="#ffe082" opacity="0.5"/>
  <rect x="476" y="0" width="4" height="960" fill="#ffe082" opacity="0.5"/>
