    <rect x="120" y="735" width="8" height="60" rx="3"/>
    <rect x="180" y="735" width="8" height="60" rx="3"/>
    <rect x="240" y="735" width="8" height="60" rx="3"/>
    <rect x="300" y="735" width="8" height="60" rx="3"/>
    <rect x="360" y="735" width="8" height="60" rx="3"/>
    <rect x="420" y="735" width="8" height="60" rx="3"/>
    <rect x="470" y="735" width="8" height="60" rx="3"/>
    <rect x="0" y="748" width="480" height="7" rx="3"/>
    <rect x="0" y="770" width="480" height="7" rx="3"/>
