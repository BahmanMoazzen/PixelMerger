<svg xmlns="http://www.w3.org/2000/svg" width="480" height="960" viewBox="0 0 480 960">
  <defs>
    <radialGradient id="dawnsky" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="35%" stop-color="#ffb74d"/>
      <stop offset="65%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#e57373"/>
    </radialGradient>
    <radialGradient id="glowsun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffe082" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig4" cx="50%" cy="50%" r="75%">
      <stop offset="50%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#b03a00" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="480" height="960" fill="url(#dawnsky)"/>

  <!-- Sun glow -->
