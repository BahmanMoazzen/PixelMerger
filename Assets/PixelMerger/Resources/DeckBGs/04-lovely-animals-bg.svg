  <polygon points="310,600 470,600 390,530" fill="#6d3018" opacity="0.6"/>
  <rect x="370" y="700" width="38" height="80" fill="#5a2010" opacity="0.7"/>
  <rect x="332" y="640" width="36" height="36" fill="#ffcc02" opacity="0.3"/>

